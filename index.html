<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    
    <!-- Link do site: kadolist.netlify.app -->

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ka-Do List</title>
    <link href="styles.css" rel="stylesheet" />

    <!-- Icone do site -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="/favicon/site.webmanifest" />
  </head>

  <body>
    <!-- Cabeçalho -->
    <header>
      <input id="theme-toggle" type="image" src="/images/light_mode-icon.png" />
      <h3>Ka-Do List</h3>

      <form id="submit-section" autocomplete="off">
        <input
          id="submit-input"
          class="submit-el"
          placeholder="Crie uma tarefa!"
          maxlength="50"
        />
        <button id="submit-btn" class="submit-el" type="submit">
          <div></div>
        </button>
      </form>
    </header>

    <!-- Tarefas -->
    <main>
      <section id="task-section"></section>
    </main>
    <script src="script.js"></script>
  </body>
</html>

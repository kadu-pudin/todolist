<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="styles.css" rel="stylesheet" />
    <title>To-Do List</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>

  <body>
    <input id="theme-toggle" type="image" src="/images/light_mode-icon.png" />
    <header>
      <h3>To-Do List</h3>
      <form id="submit-section" autocomplete="off">
        <input
          id="submit-input"
          class="submit-el"
          placeholder="Crie uma nota!"
          maxlength="50"
        />
        <button id="submit-btn" class="submit-el" type="submit">
          <div></div>
        </button>
      </form>
    </header>
    <main>
      <section id="task-section"></section>
    </main>
    <script src="script.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="styles.css" rel="stylesheet" />
    <title>To-Do List</title>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon/icon-dark.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon/favicon-dark-32x32.png"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon/favicon-light-32x32.png"
      media="(prefers-color-scheme: light)"
    />
  </head>

  <body>
    <input id="theme-toggle" type="image" src="/images/light_mode-icon.png" />
    <header>
      <h3>To-Do List</h3>
      <form id="submit-section" autocomplete="off">
        <input
          id="submit-input"
          class="submit-el"
          placeholder="Crie uma nota!"
          maxlength="50"
        />
        <button id="submit-btn" class="submit-el" type="submit">
          <div></div>
        </button>
      </form>
    </header>
    <main>
      <section id="task-section"></section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
